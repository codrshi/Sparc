services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file: 
      - ./server/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  server:
    build: ./server
    container_name: sparc-server
    environment:
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/api/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
  # client:
  #   build: ./client
  #   container_name: sparc-client
  #   environment:
  #     TZ: Asia/Kolkata
  #   depends_on:
  #     - server
  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./client/build:/usr/share/nginx/html
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: